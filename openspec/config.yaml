schema: spec-driven

context: |
  sobres is a Python 3.11+ CLI/library for equity research, not investment advice.
  Read openspec/project.md and the active proposal/design/tasks/scenarios first.
  Layout (enforced by tests/architecture/test_layering.py): pure financial math and
  types in src/sobres/core (no I/O, logging or tracing); provider protocols, vendor
  adapters, the observation cache and the storage port in src/sobres/data (drivers only
  under data/storage/adapters); Typer and FastAPI adapters in cli/ and api/ with no
  business logic; one registry declaration per command generates CLI, API and UI.
  Settings and doctor checks are declared once. Use shared currency conversion,
  distinguish missing observations from closures/listing gaps and preserve WAL-safe
  backup, transaction and cache-clear semantics. SQLite is the operational default;
  another backend is a new adapter plus the shared conformance suite.
  ruff (lint + format, line length 100), mypy --strict, 90% branch coverage, offline
  known-answer tests, recorded provider fixtures and the base-wheel smoke test gate
  every merge. Publishing uses organization tokens (PYPI_PROD/PYPI_TEST) behind
  RELEASE_ENABLED; never copy them to repository secrets or switch to OIDC silently.
  Change 0013 (template alignment / package migration) is superseded; do not target
  ports/, application/ or adapters/ paths.

rules:
  proposal:
    - State the user-visible outcome first and always include Non-goals.
    - Identify the issue, planning PR and predecessor changes; mark unpublished links honestly.
    - Link relied-on template/context decisions with revision and applicability; do not copy private prose.
    - Distinguish proposed plans, branch-local implementations, merged behavior and deferred scope.
  tasks:
    - Tasks are at most about two hours, each naming its proof and one coherent commit.
    - Group one to three related tasks per PR; explain larger atomic scope.
    - Verify merged planning ancestry before implementation; new acceptance stays unchecked until tested.
  specs:
    - Every requirement has substantive SHALL/MUST text and WHEN/THEN scenarios.
    - Preserve domain correctness and public compatibility through structural changes.
