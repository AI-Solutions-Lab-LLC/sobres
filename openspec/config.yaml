schema: spec-driven

context: |
  sobres is a Python 3.11+ CLI/library for equity research, not investment advice.
  Read openspec/project.md and the active proposal/design/tasks/scenarios first.
  0013 proposes alignment with the merged AISL template; current code still uses
  core/data/cli until that migration implements its compatibility facades.
  Target: pure financial math/types in src/sobres/core; shared orchestration in
  application; repository/provider interfaces in ports; concrete CLI/API/storage/
  provider I/O in adapters; bootstrap owns construction. Registry declarations are
  transport-neutral. No I/O/logging/tracing in core and no concrete adapters in
  application or ports. Preserve public core imports and CLI names/defaults/output.
  Explicit exposure selects API/UI operations; local administration is not exposed.
  Settings and doctor checks are declared once. Use shared currency conversion,
  distinguish missing observations from closures/listing gaps and preserve WAL-safe
  backup, transaction and cache-clear semantics. SQLite is the operational default;
  another backend requires real-engine contracts and data cutover/rollback evidence.
  Private context is optional; public builds/tests/installations need no lake access.
  Black and isort with Black profile, both line length 100, after every Python edit.
  Keep compatible Ruff lint, strict typing, 90% branch coverage, offline known-answer
  tests, recorded provider fixtures and base wheel/init/doctor/data verification.
  Current Ruff-format gates remain until the explicit 0013 tooling migration.
  Preserve 0000's org-token publishing decision and existing issue 21; do not copy
  the template OIDC publisher over it. Cloud/enterprise profiles remain deferred.

rules:
  proposal:
    - State the user-visible outcome first and always include Non-goals.
    - Identify the issue, planning PR and predecessor changes; mark unpublished links honestly.
    - Link relied-on template/context decisions with revision and applicability; do not copy private prose.
    - Distinguish proposed plans, branch-local implementations, merged behavior and deferred scope.
  tasks:
    - Tasks are at most about two hours, each naming its proof and one coherent commit.
    - Group one to three related tasks per PR; explain larger atomic scope.
    - Verify merged planning ancestry before implementation; new acceptance stays unchecked until tested.
  specs:
    - Every requirement has substantive SHALL/MUST text and WHEN/THEN scenarios.
    - Preserve domain correctness and public compatibility through structural changes.
